services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: serialized_dcb
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serialized_dcb"]
      interval: 5s
      timeout: 5s
      retries: 12
