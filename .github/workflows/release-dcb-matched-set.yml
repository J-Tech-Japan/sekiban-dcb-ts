name: Release matched DCB package set

on:
  push:
    tags:
      - "dcb-v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify the dependency-ordered matched release tag
        run: node scripts/dcb-matched-set-release-check.mjs "${GITHUB_REF_NAME}"
      - name: Run the relevant domain suite before any publish step
        run: npm run test:domain-package
      - name: Detect repository visibility for npm provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          case "${repository_private}" in
            true|false) ;;
            *) echo "Unexpected repository visibility response: ${repository_private}" >&2; exit 1 ;;
          esac
          echo "REPO_IS_PRIVATE=${repository_private}" >> "${GITHUB_ENV}"
          echo "repository visibility: $([[ "${repository_private}" == "true" ]] && echo private || echo public)"
      - name: Run matched-set build, tarball and consumer gates
        run: npm run test:release:matched-set
      - name: Run publish command-shape guards
        run: npm run test:release:matched-set:publish-shape
      - name: Credential-free dry-run of every publish path
        run: npm run test:release:matched-set:publish-dry-run
      - name: Resolve trusted publishing, token, or credential-free fallback
        id: publish-selection
        run: node scripts/g72-trusted-publishing-selection.mjs --github-output "${GITHUB_OUTPUT}"
      - name: Run trusted publishing selection and provenance guards
        run: npm run test:release:trusted-publishing
      - name: Publish the matched set with the selected authentication path
        env:
          AUTH_MODE: ${{ steps.publish-selection.outputs.auth_mode }}
          PRIVATE_REPOSITORY: ${{ steps.publish-selection.outputs.private_repository }}
          PROVENANCE_ENABLED: ${{ steps.publish-selection.outputs.provenance_enabled }}
          UNSET_NODE_AUTH_TOKEN: ${{ steps.publish-selection.outputs.unset_node_auth_token }}
        run: |
          set -euo pipefail
          publish_args=(--access public)
          publish_env=()
          if [[ "${PROVENANCE_ENABLED}" == "true" ]]; then
            publish_args+=(--provenance)
          elif [[ "${PRIVATE_REPOSITORY}" == "true" ]]; then
            # npm may auto-enable provenance in GitHub Actions even when the
            # flag is omitted. The package manifests also carry the public
            # release policy, so remove that publish-only provenance field
            # from this isolated checkout before the private publish. Private
            # source repositories are rejected by the registry for that
            # bundle; the public branch keeps the field and explicit flag.
            publish_env+=(NPM_CONFIG_PROVENANCE=false)
            for package in packages/dcb-core packages/dcb-domain packages/dcb-client packages/dcb-runtime; do
              echo "private publish metadata: remove publishConfig.provenance from ${package}"
              (
                cd "${package}"
                npm pkg delete publishConfig.provenance
                node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("package.json", "utf8")); if (Object.hasOwn(manifest.publishConfig ?? {}, "provenance")) { throw new Error("publishConfig.provenance remains in package.json"); }'
              )
            done
          fi
          case "${AUTH_MODE}" in
            trusted-publishing)
              if [[ "${UNSET_NODE_AUTH_TOKEN}" != "true" ]]; then
                echo "trusted publishing selection did not request token removal" >&2
                exit 1
              fi
              echo "authentication branch: trusted-publishing (GitHub Actions OIDC; NPM_TOKEN omitted)"
              for package in packages/dcb-core packages/dcb-domain packages/dcb-client packages/dcb-runtime; do
                echo "publish: ${package}"
                echo "command: npm publish ${publish_args[*]}"
                (cd "${package}" && env -u NODE_AUTH_TOKEN "${publish_env[@]}" npm publish "${publish_args[@]}")
              done
              ;;
            token)
              if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
                echo "token authentication was selected without an NPM_TOKEN" >&2
                exit 1
              fi
              echo "authentication branch: token (NPM_TOKEN)"
              for package in packages/dcb-core packages/dcb-domain packages/dcb-client packages/dcb-runtime; do
                echo "publish: ${package}"
                echo "command: npm publish ${publish_args[*]}"
                (cd "${package}" && env "${publish_env[@]}" npm publish "${publish_args[@]}")
              done
              ;;
            credential-free-dry-run)
              echo "authentication branch: credential-free-dry-run"
              echo "NPM_TRUSTED_PUBLISHING is not true and NPM_TOKEN is not configured; no package was published."
              echo "The credential-free dry-run above is the verified fallback."
              ;;
            *)
              echo "unknown publish authentication mode: ${AUTH_MODE}" >&2
              exit 1
              ;;
          esac
