name: Release matched DCB package set

on:
  push:
    tags:
      - "dcb-v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify the dependency-ordered matched release tag
        run: node scripts/dcb-matched-set-release-check.mjs "${GITHUB_REF_NAME}"
      - name: Run the relevant domain suite before any publish step
        run: npm run test:g28
      - name: Detect repository visibility for npm provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          case "${repository_private}" in
            true|false) ;;
            *) echo "Unexpected repository visibility response: ${repository_private}" >&2; exit 1 ;;
          esac
          echo "REPO_IS_PRIVATE=${repository_private}" >> "${GITHUB_ENV}"
          echo "repository visibility: $([[ "${repository_private}" == "true" ]] && echo private || echo public)"
      - name: Run matched-set build, tarball and consumer gates
        run: npm run test:g64
      - name: Run publish command-shape guards
        run: npm run test:g64:publish-shape
      - name: Credential-free dry-run of every publish path
        run: npm run test:g64:publish-dry-run
      - name: Publish the matched set with provenance or retain verified dry-run fallback
        run: |
          set -euo pipefail
          publish_args=(--access public)
          publish_env=()
          if [[ "${REPO_IS_PRIVATE}" == "false" ]]; then
            publish_args+=(--provenance)
          else
            # npm may auto-enable provenance in GitHub Actions even when the
            # flag is omitted. The package manifests also carry the public
            # release policy, so remove that publish-only provenance field
            # from this isolated checkout before the private publish. Private
            # source repositories are rejected by the registry for that
            # bundle; the public branch keeps the field and explicit flag.
            publish_env+=(NPM_CONFIG_PROVENANCE=false)
            for package in packages/dcb-core packages/dcb-domain packages/dcb-client; do
              echo "private publish metadata: remove publishConfig.provenance from ${package}"
              (
                cd "${package}"
                npm pkg delete publishConfig.provenance
                [[ "$(npm pkg get publishConfig.provenance --json)" == "{}" ]]
              )
            done
          fi
          if [[ "${NPM_TRUSTED_PUBLISHING}" == "true" || -n "${NODE_AUTH_TOKEN}" ]]; then
            for package in packages/dcb-core packages/dcb-domain packages/dcb-client; do
              echo "publish: ${package}"
              echo "command: npm publish ${publish_args[*]}"
              (cd "${package}" && env "${publish_env[@]}" npm publish "${publish_args[@]}")
            done
          else
            echo "NPM_TRUSTED_PUBLISHING is not true and NPM_TOKEN is not configured; no package was published."
            echo "The credential-free dry-run above is the verified fallback."
          fi
