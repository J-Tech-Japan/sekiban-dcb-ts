name: Full CI backstop

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-main
  cancel-in-progress: false

env:
  SDT_G79_HOSTED_MEASURE: "1"

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Execute every manifest lane with fresh Docker services
        run: node scripts/ci-local.mjs --full
