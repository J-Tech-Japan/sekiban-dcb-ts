# Publish only unpublished matched-set packages (SDT-G99)

# First-time scoped packages need an NPM_TOKEN with org publish rights;
# trusted-publishing OIDC alone often returns 404 until the package exists.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package directories under packages/ (default: dcb-runtime)"
        required: false
        default: "dcb-runtime"

permissions:
  contents: read
  id-token: write

jobs:
  publish-unpublished:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:packages
      - name: Detect repository visibility for npm provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          echo "REPO_IS_PRIVATE=${repository_private}" >> "${GITHUB_ENV}"
      - name: Publish unpublished packages via NPM_TOKEN (skip version collisions)
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required for first-time @sekiban package publish" >&2
            exit 1
          fi
          if [[ "${REPO_IS_PRIVATE}" == "true" ]]; then
            export PRIVATE_REPOSITORY=true
            for package in ${{ inputs.packages }}; do
              (cd "packages/${package}" && npm pkg delete publishConfig.provenance || true)
            done
          else
            export PRIVATE_REPOSITORY=false
          fi
          node scripts/dcb-matched-set-publish-unpublished.mjs ${{ inputs.packages }}
          npm view @sekiban/dcb-runtime version
