          fetch-tags: true
      - name: Install .NET for the pinned SDT-G32 C# parity runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
