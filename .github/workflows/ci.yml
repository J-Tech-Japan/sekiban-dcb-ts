        run: npm run test:g28:boundary:source
      - name: Run SDT-G28 negative-fixture independent probe
        run: npm run test:g28:boundary:negative
      - name: Run SDT-G28 package-manifest independent probe
        run: npm run test:g28:boundary:package
      - name: Prove SDT-G28 forced-red CI reachability
        run: |
          if SDT_G28_FORCE_FAILURE=1 npm run test:g28:forced-red; then
            echo "SDT-G28 forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove SDT-G28 boundary gate forced-red reachability
        run: |
          if SDT_G28_BOUNDARY_FORCE_FAILURE=1 npm run test:g28:boundaries; then
            echo "SDT-G28 boundary forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove each SDT-G28 boundary gate has an independent forced-red probe
        run: |
          if SDT_G28_BOUNDARY_FORCE_FAILURE_GATE=source npm run test:g28:boundary:source; then
            echo "SDT-G28 source gate forced-red probe unexpectedly passed"
            exit 1
          fi
          if SDT_G28_BOUNDARY_FORCE_FAILURE_GATE=negative-fixtures npm run test:g28:boundary:negative; then
            echo "SDT-G28 negative-fixtures gate forced-red probe unexpectedly passed"
            exit 1
