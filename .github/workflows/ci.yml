name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/serialized_dcb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serialized_dcb
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d serialized_dcb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install .NET for the pinned SDT-G32 C# parity runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run SDT-G28 dedicated compile-fail and package-boundary gates
        run: npm run test:g28:compile-fail
      - name: Prove SDT-G28 pinned compile-fail lane reachability
        run: |
          if SDT_G28_COMPILE_FAIL_FORCE_FAILURE=1 npm run test:g28:compile-fail:forced-red; then
            echo "SDT-G28 compile-fail forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G28 authoring, session, bridge, and parse lane
        run: npm run test:g28
      - name: Run SDT-G28 dependency/import/npm-pack boundary gate
        run: npm run test:g28:boundaries
      - name: Run SDT-G28 source-boundary independent probe
        run: npm run test:g28:boundary:source
      - name: Run SDT-G28 negative-fixture independent probe
        run: npm run test:g28:boundary:negative
      - name: Run SDT-G28 package-manifest independent probe
        run: npm run test:g28:boundary:package
      - name: Prove SDT-G28 forced-red CI reachability
        run: |
          if SDT_G28_FORCE_FAILURE=1 npm run test:g28:forced-red; then
            echo "SDT-G28 forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove SDT-G28 boundary gate forced-red reachability
        run: |
          if SDT_G28_BOUNDARY_FORCE_FAILURE=1 npm run test:g28:boundaries; then
            echo "SDT-G28 boundary forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove each SDT-G28 boundary gate has an independent forced-red probe
        run: |
          if SDT_G28_BOUNDARY_FORCE_FAILURE_GATE=source npm run test:g28:boundary:source; then
            echo "SDT-G28 source gate forced-red probe unexpectedly passed"
            exit 1
          fi
          if SDT_G28_BOUNDARY_FORCE_FAILURE_GATE=negative-fixtures npm run test:g28:boundary:negative; then
            echo "SDT-G28 negative-fixtures gate forced-red probe unexpectedly passed"
            exit 1
          fi
          if SDT_G28_BOUNDARY_FORCE_FAILURE_GATE=package-manifest npm run test:g28:boundary:package; then
            echo "SDT-G28 package-manifest gate forced-red probe unexpectedly passed"
            exit 1
          fi
      - run: npm test
      - run: npm run test:g17
      - run: npm run test:g17:rollout-order
      - name: Run SDT-G21 bootstrap import core lane
        run: npm run test:g21
      - name: Prove SDT-G21 forced-red CI reachability
        run: |
          if SDT_G21_FORCE_FAILURE=1 npm run test:g21:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G22 provider and operator lane
        run: npm run test:g22
      - name: Prove SDT-G22 forced-red CI reachability
        run: |
          if SDT_G22_FORCE_FAILURE=1 npm run test:g22:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G23 unsafe-window MV core lane
        run: npm run test:g23
      - name: Prove SDT-G23 forced-red CI reachability
        run: |
          if SDT_G23_FORCE_FAILURE=1 npm run test:g23:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G24 hardening guard lane
        run: npm run test:g24
      - name: Prove SDT-G24 forced-red CI reachability
        run: |
          if SDT_G24_FORCE_FAILURE=1 npm run test:g24:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G25 unsafe-window composition lane
        run: npm run test:g25
      - name: Prove SDT-G25 forced-red CI reachability
        run: |
          if SDT_G25_FORCE_FAILURE=1 npm run test:g25:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G26 direct-doorbell and multi-view lane
        run: npm run test:g26
      - name: Run SDT-G27 canonical identity and OrderClock lane
        run: npm run test:g27
      - name: Prove SDT-G27 forced-red CI reachability
        run: |
          if SDT_G27_FORCE_FAILURE=1 npm run test:g27:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove SDT-G26 forced-red CI reachability
        run: |
          if SDT_G26_FORCE_FAILURE=1 npm run test:g26:forced-red; then
            echo "forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G26 effective topology verifier oracle
        run: npm run test:g26:topology
      - name: Prove SDT-G26 topology verifier forced-red reachability
        run: |
          if SDT_G26_TOPOLOGY_FORCE_FAILURE=1 npm run test:g26:topology; then
            echo "topology forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 mapping contract lane
        run: npm run test:g29:mapping
      - name: Prove SDT-G29 mapping forced-red reachability
        run: |
          if SDT_G29_MAPPING_FORCE_FAILURE=1 npm run test:g29:mapping:forced-red; then
            echo "SDT-G29 mapping forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 delivery matrix lane
        run: npm run test:g29:delivery
      - name: Prove SDT-G29 delivery forced-red reachability
        run: |
          if SDT_G29_DELIVERY_FORCE_FAILURE=1 npm run test:g29:delivery:forced-red; then
            echo "SDT-G29 delivery forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 diagnostics and compatibility lanes
        run: npm run test:g29:diagnostics && npm run test:g29:compatibility
      - name: Prove SDT-G29 diagnostics and compatibility forced-red reachability
        run: |
          if SDT_G29_DIAGNOSTICS_FORCE_FAILURE=1 npm run test:g29:diagnostics:forced-red; then
            echo "SDT-G29 diagnostics forced-red probe unexpectedly passed"
            exit 1
          fi
          if SDT_G29_COMPATIBILITY_FORCE_FAILURE=1 npm run test:g29:compatibility:forced-red; then
            echo "SDT-G29 compatibility forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 domain source lint mutation lane
        run: npm run test:g29:domain-source
      - name: Prove SDT-G29 domain source lint forced-red reachability
        run: |
          if SDT_G29_DOMAIN_SOURCE_FORCE_FAILURE=1 npm run test:g29:domain-source:forced-red; then
            echo "SDT-G29 domain source forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 pinned authoring correspondence lane
        run: npm run test:g29:authoring-doc
      - name: Prove SDT-G29 authoring correspondence forced-red reachability
        run: |
          if SDT_G29_AUTHORING_DOC_FORCE_FAILURE=1 npm run test:g29:authoring-doc:forced-red; then
            echo "SDT-G29 authoring correspondence forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 rewritten meeting-room sample lane
        run: npm run test:g29:sample
      - name: Prove SDT-G29 sample forced-red reachability
        run: |
          if SDT_G29_SAMPLE_FORCE_FAILURE=1 npm run test:g29:sample:forced-red; then
            echo "SDT-G29 sample forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G29 witness and fixed-N oracle lane
        run: npm run test:g29:witness
      - name: Prove SDT-G29 witness forced-red reachability
        run: |
          if SDT_G29_WITNESS_FORCE_FAILURE=1 npm run test:g29:witness:forced-red; then
            echo "SDT-G29 witness forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G31 bounded d1-mv waitFor and sample auto-refresh lane
        run: npm run test:g31
      - name: Prove SDT-G31 forced-red CI reachability
        run: |
          if SDT_G31_FORCE_FAILURE=1 npm run test:g31:forced-red; then
            echo "SDT-G31 forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Run SDT-G32 C# parity, logical-record, tags, and cutover lane
        run: npm run test:g32
      - name: Prove SDT-G32 forced-red CI reachability
        run: |
          if SDT_G32_FORCE_FAILURE=1 npm run test:g32:forced-red; then
            echo "SDT-G32 forced-red probe unexpectedly passed"
            exit 1
          fi
      - run: npm run test:store-contract
      - name: Run required Miniflare D1 contract and fault lane
        run: npm run test:d1
      - name: Run required Miniflare D1 MV core lane (two D1 bindings)
        run: npm run test:mv
      - run: npm run test:boundaries
      - run: npm run test:consumer
      - run: npm run build
      - name: Run G15 local E2E
        env:
          G15_LOCAL_PORT: 8787
          G15_LOCAL_SERVICE_ID: ci-g15-local
          G15_LOCAL_PERSIST_DIR: ${{ runner.temp }}/sdt-g15-wrangler-state
        run: npm run e2e:g15:local
      - name: Isolate G16 E2E PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          database="sdt_g16_${GITHUB_RUN_ID}"
          psql --host 127.0.0.1 --username postgres --dbname postgres \
            --command "CREATE DATABASE \"${database}\""
          printf 'POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/%s\n' "${database}" >> "${GITHUB_ENV}"
      - run: npm run test:g16
      - name: Run G16 local E2E
        env:
          G15_LOCAL_PORT: 8788
          G15_LOCAL_SERVICE_ID: ci-g16-local
          G15_LOCAL_PERSIST_DIR: ${{ runner.temp }}/sdt-g16-wrangler-state
        run: npm run e2e:g16:local

  # Required Phase 1.5 lane. The adapter uses only gateway-mode operations
  # covered by the Linux vNext emulator: database/container bootstrap,
  # parameterized queries, continuation reads, create-conflict idempotency,
  # and If-Match conditional replacement. Missing readiness or credentials
  # fail the job; this lane is never converted into a skipped green check.
  cosmos-emulator:
    runs-on: ubuntu-latest
    env:
      COSMOS_ENDPOINT: http://127.0.0.1:8081/
      COSMOS_DATABASE: sdt_g12_ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Candidate evidence references retained commits that may no longer have
      # a source branch after a squash.  Fetch the immutable objects directly
      # so the unchanged digest gate can inspect their trees.
      - name: Fetch retained candidate history for evidence verification
        run: >-
          git fetch --no-tags origin
          8dbb4be825e084adef92065496cc0ffdc22b28ed
          5439b8bda255144b608fcdeb6c89dc44dcb667d7
          38219c8a6526a0209295e9f06450cce9e2217004
          2f024d019d6861ad8ff43a2d194eabdcd975cbc0
          95197cf1140d1179b52e1f01280002bc090bb891
          36de26747ba71a583908f1f6f22102150e98f72b
          f1d3d7163f08a55c70fb8f66a38070be74f7caaf
          da2a8356fdbd898fa044884469b57a51ed8da996
          1b5a8ff1d4aaac95c79cb9ddbd6cc311080479f6
          1a9a5f22238a4755b8f15cdc17aec4f68bcde79d
          f401342df68461d3239f58b14ff6891db4214ac6
          50200ef2c6a29531d1e9d25a2f7ea7e6d07a838f
          f7d306c0018b1b7046095891186b8409c9b16863
          16afe111b8e3aa3a48dc949b0caa33160b08f29f
          f4dfd8192aaee9ed43116d7e5109d496ac2a6ce7
          6308fb446335000d8729d490b170b189734461a4
          5951844348bfd0ffadddb5c7c3c2bb0f57b100c6
          cc4d0a86b749dc3ba09fe366a470c70b329bd10f
          4a67b0a62120c85ec6aec855f09e38aca430557f
          2db888bc9e57e04b66b4525270d312e8ddf78530
          d6bfb5c5b4f5da1d44985199a4820786be6e89a1
          13e8006be334454dc8a4a3c40972ba8ec15707b0
          12cc9f862c7a1b1c4f54493bf40f5ccc1c39e01d
          41e3665c055a366eb3f0d1ebff49be5d9414fa99
          b8024fccca140d4cc3c76e715d4e5dd6c368b847
          c5fff88620af3883b95639004dda08197618cc7e
          87da1e97bc6ada9c89f9cf490d7aa6b201d94f1c
          0cef60307a37964b5a4a4423f5abdc3d50b01e21
          9543fccfb0e1f7858042e815867f1d6f2a33216d
          9bf654eb555e56a2b0d5ed9f04d0aad670866e9e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate ephemeral emulator credential in protected runner storage
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/sdt-g12-cosmos.key"
          openssl rand -base64 64 | tr -d '\n' > "$key_file"
          chmod 600 "$key_file"
          printf 'COSMOS_KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"
      - name: Start pinned Linux vNext Cosmos emulator
        run: >-
          docker run --detach --name sdt-g12-cosmos
          --publish 8080:8080 --publish 8081:8081 --publish 1234:1234
          --volume "$COSMOS_KEY_FILE:/cosmos.key:ro"
          mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:6ce44ed4ac69cf69a6cb7982d0536cfaa22696172168fc9fe9a722a189d38f99
          --key-file /cosmos.key
      - name: Wait for required Cosmos emulator readiness
        run: curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/ready >/dev/null
      - name: Execute Cosmos contract and fault lane
        run: npm run test:cosmos
      - name: Run SDT-G22 real Cosmos bootstrap provider contract
        run: npm run test:g22:cosmos
      - name: Verify Cosmos lane remains wired
        run: npm run test:cosmos-wiring
      - name: Run required G20 Cloudflare-only D1 composition lane
        run: npm run test:g20
      - name: Run G20 three-layer zero-external-database gate
        run: npm run test:g20:gate
      - name: Verify G20 candidate/evidence protocol
        run: npm run test:g20:candidate
      - name: Prove SDT-G22 candidate gate forced failure
        run: |
          if SDT_G22_CANDIDATE_FORCE_FAILURE=1 npm run test:g20:candidate; then
            echo "candidate forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove SDT-G26 candidate retention gate forced failure
        run: |
          if SDT_G26_CANDIDATE_FORCE_FAILURE=1 npm run test:g20:candidate; then
            echo "candidate forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Prove SDT-G27 candidate retention gate forced failure
        run: |
          if SDT_G27_CANDIDATE_FORCE_FAILURE=1 npm run test:g20:candidate; then
            echo "candidate forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Verify SDT-G28 candidate/evidence protocol
        run: npm run test:g20:candidate
      - name: Prove SDT-G28 candidate retention gate forced failure
        run: |
          if SDT_G28_CANDIDATE_FORCE_FAILURE=1 npm run test:g20:candidate; then
            echo "candidate forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Verify SDT-G29 required-root candidate protocol
        run: npm run test:g29:candidate
      - name: Prove SDT-G29 candidate retention gate forced failure
        run: |
          if SDT_G29_CANDIDATE_FORCE_FAILURE=1 npm run test:g29:candidate:forced-red; then
            echo "SDT-G29 candidate forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Verify SDT-G31 required-root candidate protocol
        run: npm run test:g31:candidate
      - name: Prove SDT-G31 candidate retention gate forced failure
        run: |
          if SDT_G31_CANDIDATE_FORCE_FAILURE=1 npm run test:g31:candidate:forced-red; then
            echo "SDT-G31 candidate forced-red probe unexpectedly passed"
            exit 1
          fi
      - name: Verify SDT-G32 required-root candidate protocol
        run: npm run test:g32:candidate
      - name: Prove SDT-G32 candidate retention gate forced failure
        run: |
          if SDT_G32_CANDIDATE_FORCE_FAILURE=1 npm run test:g32:candidate:forced-red; then
            echo "SDT-G32 candidate forced-red probe unexpectedly passed"
            exit 1
          fi
