  # covered by the Linux vNext emulator: database/container bootstrap,
  # parameterized queries, continuation reads, create-conflict idempotency,
  # and If-Match conditional replacement. Missing readiness or credentials
  # fail the job; this lane is never converted into a skipped green check.
  cosmos-emulator:
    runs-on: ubuntu-latest
    env:
      COSMOS_ENDPOINT: http://127.0.0.1:8081/
      COSMOS_DATABASE: sdt_g12_ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
