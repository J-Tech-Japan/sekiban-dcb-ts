name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDT_G79_HOSTED_MEASURE: "1"

jobs:
  # ci-foundation is deliberately retained as a hosted PR lane. Its command
  # list is owned by ci/lanes.json and includes the read-contract, determinism,
  # and regression-matrix hosted proofs.
  ci-foundation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/serialized_dcb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serialized_dcb
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d serialized_dcb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - id: node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json', 'package.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Execute manifest PR foundation lane
        run: node scripts/ci-local.mjs --lane foundation --ci

  # The cheap lanes share one checkout/install/service so setup and minute
  # rounding are paid once. This job also runs the tiered CI coverage guards.
  ci-pr-cheap:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/serialized_dcb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serialized_dcb
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d serialized_dcb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - id: node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json', 'package.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Execute manifest PR cheap tier and CI coverage guards
        run: node scripts/ci-local.mjs --lane cheap --ci

  # Cosmos is an experimental provider, but its real emulator contract is a
  # required PR witness. The runner owns an isolated detached worktree,
  # ephemeral key, random ports, emulator, and cleanup for this job.
  ci-cosmos-emulator:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Execute the required real Cosmos emulator lane
        run: node scripts/ci-local.mjs --lane cosmos

  # Keep the required aggregate context. always() makes skipped/failed PR
  # jobs observable; the verification guard converts either state to a red check.
  verify:
    if: ${{ always() }}
    needs: [ci-foundation, ci-pr-cheap, ci-cosmos-emulator]
    runs-on: ubuntu-latest
    env:
      G40_VERIFY_NEEDS_JSON: ${{ toJson(needs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fail verify when a PR-tier job failed or was skipped
        run: node scripts/g40-verify-needs.mjs
