      - id: sekiban-source
        uses: actions/cache@v4
        with:
          path: .artifacts/g40-sekiban-source
          key: sekiban-source-${{ runner.os }}-${{ hashFiles('tools/sekiban-parity/run.mjs', 'tools/sekiban-parity/SekibanParity.csproj') }}
      - name: Populate pinned Sekiban checkout on cache miss
        if: steps.sekiban-source.outputs.cache-hit != 'true'
        run: >-
          git clone --filter=blob:none https://github.com/J-Tech-Japan/Sekiban.git .artifacts/g40-sekiban-source &&
          git -C .artifacts/g40-sekiban-source checkout --detach 855feaa93564fef54defec76e9ccff969d4ee01a
      - id: nuget-and-parity-build
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            tools/sekiban-parity/bin
            tools/sekiban-parity/obj
          key: sekiban-parity-${{ runner.os }}-${{ hashFiles('tools/sekiban-parity/**') }}
      - name: Run SDT-G32 C# parity, logical-record, tags, and cutover lane
