  ci-g32-parity:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/serialized_dcb
      SEKIBAN_SOURCE_DIR: ${{ github.workspace }}/.artifacts/g40-sekiban-source
