  # Retain the existing required context. always() ensures this job runs even
  # when a dependency fails or is skipped; the checker below converts either
  # result into a red required `verify` status.
  verify:
    if: ${{ always() }}
    needs: [ci-foundation, ci-g28, ci-g21-g25, ci-g26-g27, ci-g29, ci-g31, ci-g32-parity, ci-g30-core, ci-g30-forced-red, ci-g38, ci-g42, ci-g43, ci-g44, ci-g45, ci-g46, ci-g41, ci-local-e2e, cosmos-emulator, ci-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fail verify when a split job failed or was skipped
        env:
          G40_VERIFY_NEEDS_JSON: ${{ toJson(needs) }}
        run: node scripts/g40-verify-needs.mjs
