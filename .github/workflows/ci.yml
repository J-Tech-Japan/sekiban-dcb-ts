name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-foundation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/serialized_dcb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serialized_dcb
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d serialized_dcb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json', 'package.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - run: npm run lint
      - name: Verify SDT-G37 sanitized recorded-sample evidence
        run: npm run test:g37:evidence
      - name: Validate SDT-G50 exact-head client and blocked-trace evidence
        run: |
          node scripts/deploy/g50-commit-latency-guards.mjs
          node scripts/deploy/g50-commit-latency-check.mjs --sample .artifacts/sdt-g50-w57-commit-latency.json --self-test
      - name: Run SDT-G52 retained-snapshot sink and log-root exporter guards
        run: npm run test:g52
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:g17
      - run: npm run test:g17:rollout-order

