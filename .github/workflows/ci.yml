      - name: Run SDT-G28 dedicated compile-fail and package-boundary gates
        run: npm run test:g28:compile-fail
      - name: Prove SDT-G28 pinned compile-fail lane reachability
        run: |
          if SDT_G28_COMPILE_FAIL_FORCE_FAILURE=1 npm run test:g28:compile-fail:forced-red; then
            echo "SDT-G28 compile-fail forced-red probe unexpectedly passed"
            exit 1
