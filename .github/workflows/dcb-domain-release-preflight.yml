name: DCB domain release preflight

on:
  pull_request:
    paths:
      - "packages/dcb-domain/**"
      - "scripts/dcb-domain-*.mjs"
      - "docs/release-process.md"
      - "CHANGELOG.md"
      - ".github/workflows/release-dcb-domain.yml"
      - ".github/workflows/dcb-domain-release-preflight.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dcb-domain-release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @sekiban/dcb-domain
      - run: npm run typecheck --workspace @sekiban/dcb-domain
      - name: Run @sekiban/dcb-domain test suite before publish
        run: |
          set -euo pipefail
          echo "head=$GITHUB_SHA"
          echo "run_id=$GITHUB_RUN_ID"
          echo "workflow=$GITHUB_WORKFLOW"
          echo "command=npm run test:domain-package"
          npm run test:domain-package
      - name: Run release package and consumer tests
        run: npm run test:domain-release
      - run: node scripts/dcb-domain-pack-check.mjs
      - run: node scripts/dcb-domain-consumer-check.mjs
      - run: node scripts/dcb-domain-release-check.mjs dcb-domain-v0.2.0
      - run: node scripts/dcb-domain-release-notes.mjs dcb-domain-v0.2.0 "$RUNNER_TEMP/dcb-domain-release-notes.md"
      - name: Credential-free release-path dry-run proof
        run: |
          set -euo pipefail
          node scripts/dcb-domain-publish-dry-run.mjs 2>&1 | tee "$RUNNER_TEMP/dcb-domain-publish-dry-run.log"
